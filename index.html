<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日讀經進度</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@300;400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .bible-font { font-family: 'Noto Serif TC', serif; }
        .verse-num { color: #3b82f6; font-weight: bold; margin-right: 0.6rem; font-size: 0.85rem; font-family: sans-serif; display: inline-block; width: 1.5rem; text-align: right; }
        .verse-text { line-height: 2; font-size: 1.25rem; display: inline-block; width: calc(100% - 2.5rem); vertical-align: top; }
        .section-card { background: white; border-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); overflow: hidden; margin-bottom: 2rem; }
        .loading-spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="max-w-3xl mx-auto p-4 sm:p-6 lg:p-8">
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
            <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                <i data-lucide="book-open" class="text-blue-600"></i>
                今日讀經進度
            </h1>
            <div class="flex items-center gap-4">
                <input type="date" id="calendar-picker" class="border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </header>

        <main id="content-area">
            <!-- 載入中狀態 -->
            <div id="status-message" class="text-center py-20 text-slate-500 bg-white rounded-xl shadow-sm border border-slate-100">
                <i data-lucide="refresh-cw" class="w-12 h-12 mx-auto mb-4 text-blue-400 loading-spinner"></i>
                <p class="text-lg font-medium">正在自動載入經文資料...</p>
            </div>
        </main>
    </div>

    <script>
        let bibleData = null;

        // 當網頁載入完成時，自動抓取同目錄下的 NC.json
        window.onload = async () => {
            lucide.createIcons();
            
            // 初始化日期選擇器
            const dateInput = document.getElementById('calendar-picker');
            const now = new Date();
            dateInput.value = now.toISOString().split('T')[0];

            try {
                // 自動抓取資料
                const response = await fetch('NC.json');
                if (!response.ok) throw new Error('無法讀取 NC.json 檔案');
                
                bibleData = await response.json();
                
                // 抓取成功後，執行第一次渲染
                render(now);
            } catch (error) {
                console.error(error);
                document.getElementById('content-area').innerHTML = `
                    <div class="text-center py-20 text-red-500 bg-white rounded-xl shadow-sm border border-red-100">
                        <i data-lucide="alert-circle" class="w-16 h-16 mx-auto mb-4"></i>
                        <p class="text-lg font-bold">資料載入失敗</p>
                        <p class="text-sm mt-2">請確認 NC.json 是否與 index.html 放在同一個資料夾中。</p>
                    </div>
                `;
                lucide.createIcons();
            }
        };

        /**
         * 渲染經文畫面
         */
        function render(date) {
            if (!bibleData) return;

            // --- 讀經進度邏輯 (示範用：取日期為章號) ---
            const targetBook = "創世記";
            let sRef = date.getDate(); 
            // ---------------------------------------

            let speedBody = "";

            if (bibleData[targetBook] && bibleData[targetBook][sRef]) {
                const versesObj = bibleData[targetBook][sRef];
                const verseNums = Object.keys(versesObj).map(Number).sort((a, b) => a - b);
                
                verseNums.forEach(v => {
                    speedBody += `
                        <div class="mb-3 hover:bg-slate-50 p-2 rounded transition-colors flex">
                            <span class="verse-num">${v}</span>
                            <span class="verse-text">${versesObj[v]}</span>
                        </div>
                    `;
                });
            } else {
                speedBody = `<p class="text-slate-500 text-center py-8">找不到《${targetBook}》第 ${sRef} 章的資料。</p>`;
            }

            document.getElementById('content-area').innerHTML = `
                <section class="section-card">
                    <div class="bg-orange-50 border-b border-orange-100 px-6 py-4 flex items-center justify-between">
                        <span class="text-orange-700 font-bold flex items-center gap-2">
                            <i data-lucide="zap" class="w-4 h-4"></i> 今日速讀
                        </span>
                        <span class="bg-orange-500 text-white text-xs px-2 py-0.5 rounded font-bold tracking-tighter">
                            ${targetBook} ${sRef} 章
                        </span>
                    </div>
                    <div class="p-6 bible-font">
                        ${speedBody}
                    </div>
                </section>
            `;

            window.scrollTo({ top: 0, behavior: 'smooth' });
            lucide.createIcons();
        }

        // 監聽日期切換
        document.getElementById('calendar-picker').addEventListener('change', (e) => {
            render(new Date(e.target.value));
        });
    </script>
</body>
</html>
